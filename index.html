<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DISTILL! — 模型权重身份牌局</title>
<link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="wordmark">DISTILL!</span>
      <span class="sub">一场关于模型权重的身份牌局</span>
    </div>
    <div class="topStatus">
      <span id="turnInfo" class="turnInfo">准备中</span>
      <span id="phaseInfo" class="phaseInfo"></span>
      <button id="logBtn" class="iconBtn" title="案件记录" aria-label="打开案件记录">记录</button>
      <button id="settingsBtn" class="iconBtn" title="设置" aria-label="打开设置">⚙</button>
    </div>
  </header>

  <main id="tableWrap">
    <div id="table">
      <div id="tableGlow"></div>
      <div id="seats"></div>
      <div id="rangeLayer"></div>
      <div id="fxLayer"></div>
      <div id="center">
        <div id="turnRibbon"></div>
        <div id="stage"></div>
        <div id="piles">
          <div class="pile" id="drawPile" title="牌堆"><span class="pileCount">0</span><span class="pileLabel">牌堆</span></div>
          <div class="pile" id="discardPile" title="弃牌堆"><span class="pileCount">0</span><span class="pileLabel">弃牌</span></div>
        </div>
        <div id="hintLine" aria-live="polite"></div>
      </div>
      <div id="dragLayer"></div>
    </div>

    <aside id="logDrawer" class="drawer hidden" aria-label="案件记录">
      <header>
        <div>
          <h3>案件记录</h3>
          <p class="drawerSub">完整的回合流水，只在你需要时展开。</p>
        </div>
        <button id="logClose" class="iconBtn" aria-label="关闭案件记录">×</button>
      </header>
      <div id="log"></div>
    </aside>
  </main>

  <section id="youPanel">
    <div id="youInfo"></div>
    <div id="handWrap">
      <div id="hand"></div>
    </div>
  </section>

  <section id="contextBar">
    <div id="prompt" aria-live="polite"></div>
    <div id="actions"></div>
  </section>

  <!-- 单一焦点弹窗：交互窗（引擎请求，强制）与检视窗（座位档案，自愿）互斥共用。 -->
  <div id="focusModal" class="hidden" role="dialog" aria-modal="true">
    <div id="focusBox">
      <header id="focusHead">
        <span id="focusKicker"></span>
        <!-- 倒计时区域占位：联机响应倒计时接入前恒为静态值。 -->
        <span id="focusCount" class="countdown" title="倒计时（占位）">99天</span>
        <div class="focusHeadBtns">
          <button id="focusCollapse" class="iconBtn" title="收起为待处理" aria-label="收起弹窗">—</button>
          <button id="focusClose" class="iconBtn hidden" title="关闭" aria-label="关闭弹窗">×</button>
        </div>
      </header>
      <div id="focusPrompt"></div>
      <div id="focusBody"></div>
      <footer id="focusFoot">
        <span id="focusHint"></span>
        <button id="focusConfirm">确认</button>
      </footer>
    </div>
  </div>

  <!-- 被收起的交互窗：待处理标记，点击切回。 -->
  <button id="pendingBadge" class="hidden" aria-live="polite"></button>

  <div id="overlay" role="dialog" aria-modal="true">
    <div id="overlayBox">
      <div id="overlayKicker">CASE FILE · 模型权重身份牌局</div>
      <div id="overlayTitle">DISTILL!</div>
      <div id="overlayBody"></div>
      <button id="overlayBtn">开始对局</button>
    </div>
  </div>

  <div id="settingsPanel" class="hidden" role="dialog" aria-modal="false">
    <header><strong>桌面设置</strong><button id="settingsClose" class="iconBtn" aria-label="关闭设置">×</button></header>
    <div class="settingRow">
      <span>提示强度</span>
      <div class="segmented" id="modeControl">
        <button data-mode="beginner">新手</button>
        <button data-mode="standard">标准</button>
        <button data-mode="expert">专家</button>
      </div>
    </div>
    <label class="settingRow"><span>减少动效</span><input id="reduceMotion" type="checkbox"></label>
    <div class="settingRow"><span>角色介绍</span><button id="introBtn" class="iconBtn" type="button">查看</button></div>
    <p class="settingNote">新手会解释第一次遇到的机制；专家只保留数字与键盘操作。</p>
  </div>

  <div id="toastLayer" aria-live="polite"></div>
</div>
<script type="module" src="./src/demo.js"></script>
</body>
</html>
